name: Type Check

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  basedpyright:
    name: basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      # Advisory for now: reports type issues without failing the build; drop
      # `continue-on-error` to make it required.
      #
      # It runs over the **whole repo**. This comment used to claim basedpyright
      # was "scoped to the typed facade/plumbing modules via [tool.basedpyright]
      # in pyproject.toml" — there has never been such a section, so anyone
      # reading this believed the report was narrower than it is.
      - name: Run basedpyright
        run: uv run basedpyright
        continue-on-error: true
