[project]
name = "kraph-server"
version = "1.0.0-rc.20"
description = ""
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "django>=5.2",
    "pydantic-settings[yaml]>=2.2",
    "psycopg[binary]>=3",
    "daphne>=4.0.0,<5",
    "channels-redis>=4.1.0,<5",
    "django-choices-field>=2.2.2,<3",
    "authentikate>=4.1.0",
    "ujson>=5.8.0,<6",
    "aioredis>=2.0.1,<3",
    "jsonpatch~=1.33",
    "django-probes>=1.7.0,<2",
    "rich>=14.0.0",
    "koherent>4",
    "django-redis>=5.4.0",
    "boto3>=1.38.9",
    "aiohttp>=3.11.18",
    "semver>=3.0.4",
    "duckdb>=1.2.2",
    "django-health-check>=3.20.0",
    "strawberry-graphql>=0.291",
    "kante>=2.1.1",
    "pyjwt>=2.12.1",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    # Declared, not merely resolved. `lint.yaml` runs `uv run ruff`, and until now
    # ruff reached the environment only as somebody else's transitive dependency —
    # so a dependency bump elsewhere could silently take the linter out of CI.
    "ruff>=0.14.0",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=9.21.0",
    "django-stubs>=5.2.0",
    "dokker>=2.8",
    "moto>=5.1.11",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
    "pytest-django>=4.11.1",
    "types-boto3[essential,sts]>=1.42.46",
]

[tool.django-stubs]
django_settings_module = "kraph_server.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kraph_server.settings_test"


[tool.ruff]
# Same as Black.
line-length = 300
target-version = "py312"

# `core-backup-do-not-delete/` is a legacy snapshot of `core/` that nobody will
# ever fix; linting it only buries the findings that matter (it carried 1,488 of
# the 5,221 findings this config used to report). Migrations are generated code.
extend-exclude = [
    "core-backup-do-not-delete",
    "**/migrations",
    "examples",
]

[tool.ruff.lint]
# These settings used to live at the top level of `[tool.ruff]`, where ruff has
# deprecated them: every run printed "the top-level linter settings are
# deprecated" and one release from now they would have been dropped silently,
# leaving the repo linted by whatever ruff's defaults happened to be. That is
# the same shape as the `[tool.mypy]` block that configured a checker nothing
# ran — see the note at the bottom of this file.
#
# **This set is the required check.** `uv run ruff check .` passes on a clean
# tree, so a violation means something new and a developer can believe the
# green. Every family here is about a defect, not a preference:
select = [
    "E9",    # the file does not parse, or cannot be read
    "F",     # pyflakes: undefined names, unused imports, shadowed bindings
    "PLE",   # pylint's error class — constructs that raise at runtime
    "ASYNC", # blocking work inside `async def`; this server is ASGI end to end
    "DTZ",   # naive datetimes — the evidence log's whole order is time
    "LOG",   # logging misuse
    "T10",   # a `breakpoint()` left in the source
    "ISC",   # implicit string concatenation: a forgotten comma in a list is a
             # silent join, and this repo builds SQL and rule documents in lists
]

ignore = [
    # Style, not a defect: a `timeout` keyword on an async def is exactly what
    # the test helper in `tests/log/` means to offer.
    "ASYNC109",
]

# NOT selected, deliberately, and not merely unburned:
#
# - `FA` would have us add `from __future__ import annotations`, and PEP 563
#   breaks Strawberry's runtime annotation resolution — the schema stops
#   building. Same reason `UP006`/`UP007`/`UP045` (rewriting `Optional[X]` and
#   `List[X]` in place) stay out of the gate: those annotations are read at
#   runtime by Strawberry and by pydantic, where an annotation is the validator.
# - `ANN`, `D1`, `I`, `UP`, `B`, `SIM`, `TRY`, `RET`, `PT`, `RUF` and the rest
#   are real but unburned debt (~3.7k findings). `lint.yaml` reports them in a
#   second, advisory step so the number is visible and can be driven down a
#   family at a time, rather than blocking every PR today.

[tool.ruff.lint.per-file-ignores]
# A test's name *is* its documentation here (see `tests/README.md`), and the
# suite is not part of the public surface.
"tests/**" = ["D1"]

[tool.semantic_release]
# This server is deployed as Docker images, not a PyPI package — so a release
# just bumps the version, writes the changelog, tags, and cuts a GitHub Release.
# No wheel is built and nothing is uploaded to PyPI.
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = false
build_command = ""
commit_message = "chore(release): v{version} [skip ci]"

# main -> stable X.Y.Z releases. next -> prereleases X.Y.Z-rc.N.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main — e.g. 1.5.3 off `1.x`
# while main is on 2.x. The regex is reused for every future major's line.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog / release notes focused on user-facing changes. These
# patterns only filter what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ', # includes the chore(release): … bump commit
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]



# No `[tool.mypy]`. It was here, set to `strict = true` with the django and
# pydantic plugins — and no CI workflow ever ran mypy, so it asserted a standard
# for this codebase that nothing checked and nobody could have met. basedpyright
# is the type checker that actually runs; see `.github/workflows/typecheck.yaml`.
