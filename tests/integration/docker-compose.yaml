
services:
   db:
      # Stock Postgres: the projection is ordinary tables now, so the custom
      # Postgres+AGE image (jhnnsrs/daten) is not needed anywhere any more.
      image: postgres:17
      environment:
         POSTGRES_DB: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      labels:
         - fakts.service=live.arkitekt.postgres
      ports:
        - 5555:5432
   redis:
      environment:
         REDIS_HOST: redis
         REDIS_PORT: 6379
      image: redis
      ports:
         - 6666:6379
   seaweedfs:
      image: chrislusf/seaweedfs:latest
      user: '0:0'
      entrypoint: /bin/sh
      command:
         - -lc
         - mkdir -p /tmp/seaweed && exec /usr/bin/weed server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/tmp/seaweed -volume.max=0 -master.volumeSizeLimitMB=1024 -filer=true -filer.port=8888
      volumes:
         - ./configs/seaweed.toml:/etc/seaweedfs/security.toml
      ports:
         - 18888:8888
      

volumes:
   chroma_data:
